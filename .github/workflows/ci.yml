name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      # Estes dois passos são OBRIGATÓRIOS antes do typecheck: sem eles o
      # `tsc --noEmit` falha com dezenas de erros falsos em cascata
      # ("Cannot find module '@patacerta/shared'" + TS7006 implicit any em
      # tudo o que consome tipos do shared/Prisma). Os jobs `test-api` e
      # `test-web` já os corriam; este não — e por isso o CI esteve vermelho.
      # Ver docs/DEVELOPMENT.md e cards PATA-CI-1/PATA-CI-2.
      - run: pnpm --filter @patacerta/shared build
      - run: pnpm --filter @patacerta/api db:generate
      - run: pnpm typecheck
      - run: pnpm format:check

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patacerta
          POSTGRES_PASSWORD: patacerta_test
          POSTGRES_DB: patacerta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patacerta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://patacerta:patacerta_test@localhost:5432/patacerta_test
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @patacerta/shared build
      - run: pnpm --filter @patacerta/api db:generate
      - run: pnpm --filter @patacerta/api db:migrate deploy
        env:
          DATABASE_URL: postgresql://patacerta:patacerta_test@localhost:5432/patacerta_test
      - run: pnpm --filter @patacerta/api test

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @patacerta/shared build
      - run: pnpm --filter @patacerta/web typecheck
      - run: pnpm --filter @patacerta/web test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      # Mesmo requisito do job `lint-and-typecheck`: sem `shared build` +
      # `db:generate` o `pnpm -r --filter "./apps/*" build` (que compila a API
      # com `tsc`) falha com exactamente os mesmos erros falsos em cascata
      # (TS2307 '@patacerta/shared', TS2305 '@prisma/client'.PrismaClient).
      # Este job vinha a ser `skipped` (needs: lint-and-typecheck), por isso o
      # defeito só apareceria depois de o primeiro ser corrigido.
      # Verificado em PATA-CI-1: 135 erros TS sem prep / build verde com prep.
      - run: pnpm --filter @patacerta/shared build
      - run: pnpm --filter @patacerta/api db:generate
      - run: pnpm build
