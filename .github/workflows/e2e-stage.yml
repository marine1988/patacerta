name: E2E (Stage)

# Corre os testes Playwright contra a instância de stage já deployed.
# Não arranca nenhuma stack — apenas aponta o `baseURL` para a URL pública
# e usa as credenciais do seed demo (DemoPass123) que já lá estão.
#
# Útil como smoke contínuo para detectar regressões em stage.
#
# TRIGGER (PATA-CI-3): push para `dev` + `workflow_dispatch`.
# O stage é deployed de `dev` (AGENTS.md §9 — `main`→produção, `dev`→stage), por
# isso é em `dev` que o smoke tem de disparar. A branch `stage` saiu do trigger:
# estava 285 commits atrás, ninguém lá fazia push e este workflow só tinha
# corrido uma vez (2026-04-28) — nunca a seguir a um deploy real.
#
# CORRIDA COM O DEPLOY: o push que dispara este workflow dispara *também* o
# deploy do Dokploy, que demora ~3-5 min (AGENTS.md §9). Sem esperar, a suite
# testaria o build ANTERIOR e o gate mentia. O step `Aguardar deploy`
# (só em push) resolve-o com evidência real: lê o `Last-Modified` de `/` — o
# nginx serve o `index.html` baked na imagem, por isso o header é o instante do
# build/deploy (verificado em produção: `2026-09-03T14:50:49Z` para o merge de
# `14:49:36Z`) — e só avança quando ele for >= ao instante de arranque do job.
# Se o header não existir ou não for legível, espera
# `vars.E2E_DEPLOY_WAIT_SECONDS` (default 300s) e avisa; se existir mas o
# deploy não chegar em `vars.E2E_DEPLOY_TIMEOUT_SECONDS` (default 600s), falha
# de propósito em vez de correr contra o build antigo.
#
# ⚠️ BASIC AUTH: `stage.patacerta.pt` está atrás de HTTP basic auth do Traefik
# (`www-authenticate: Basic realm="traefik"`, ver PATA-BUG-1). Sem credenciais
# TODOS os paths devolvem 401 e a suite nunca corre. Este workflow lê-as de
# secrets do repo (`E2E_HTTP_USER` / `E2E_HTTP_PASS`) e passa-as ao Playwright
# via env — a `apps/web/playwright.config.ts` injecta-as em `use.httpCredentials`
# (browser + fixture `request`). Produção (`patacerta.pt`) não tem basic auth.
#
# Criar/atualizar os secrets (Settings > Secrets and variables > Actions):
#   E2E_HTTP_USER  — utilizador do middleware que protege o stage
#   E2E_HTTP_PASS  — password do mesmo middleware
#
# Alternativa sem credenciais (decisão de infra): excluir no Traefik as rotas
# que o E2E usa (p.ex. `/api/health`) do middleware de basic auth.
# Ver docs/E2E_STAGE_BASIC_AUTH.md.

on:
  workflow_dispatch:
    inputs:
      stage_url:
        description: 'URL base de stage (override do default)'
        required: false
        default: 'https://stage.patacerta.pt'
      grep:
        description: 'Filtro Playwright (--grep). Ex: "@smoke" ou "Homepage"'
        required: false
        default: ''
  push:
    # `dev` = branch que faz deploy do stage. (PATA-CI-3: era `stage`, branch
    # morta que já não recebe push nenhum — o smoke nunca corria após deploy.)
    branches: [dev]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  STAGE_URL_DEFAULT: 'https://stage.patacerta.pt'

jobs:
  e2e-stage:
    name: Playwright E2E vs Stage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # baseURL público — Playwright NÃO arranca nenhum webServer porque
      # E2E_BASE_URL está definido (ver playwright.config.ts).
      E2E_BASE_URL: ${{ github.event.inputs.stage_url || 'https://stage.patacerta.pt' }}
      E2E_API_URL: ${{ github.event.inputs.stage_url || 'https://stage.patacerta.pt' }}/api
      # Basic auth do Traefik (só stage) — env-driven, nunca hard-coded.
      # Sem estes secrets o alvo devolve 401 em tudo e o step de pré-voo falha
      # com mensagem explícita (antes falhava no sanity check com "abort").
      E2E_HTTP_USER: ${{ secrets.E2E_HTTP_USER }}
      E2E_HTTP_PASS: ${{ secrets.E2E_HTTP_PASS }}
      # Skipa testes que escrevem na BD (registo de novas contas, checkout
      # Stripe, webhooks). O smoke de stage é read-only por desenho; a suite
      # completa (com @destructive) corre no workflow `E2E`, contra uma stack
      # local efémera.
      E2E_SKIP_DESTRUCTIVE: 'true'
      CI: 'true'

    steps:
      # Âncora temporal do run — referência do step `Aguardar deploy`.
      # Usa-se o instante de arranque do job e não o timestamp do commit: o
      # deploy do Dokploy começa quando o push chega ao Dokploy, e é isso que o
      # `Last-Modified` do alvo reflecte.
      - name: Registar âncora temporal
        run: echo "RUN_ANCHOR_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash

      - name: Pré-voo — credenciais do alvo
        run: |
          host="$(printf '%s' "$E2E_BASE_URL" | sed -E 's#^[a-z]+://([^/]+).*#\1#')"
          if [ -n "$E2E_HTTP_USER" ] && [ -n "$E2E_HTTP_PASS" ]; then
            echo "httpCredentials: presentes (alvo=$host)"
            exit 0
          fi
          case "$host" in
            patacerta.pt|www.patacerta.pt)
              echo "alvo=$host (produção, sem basic auth) — a continuar sem credenciais"
              exit 0
              ;;
          esac
          echo "::error title=Credenciais de basic auth em falta::$host exige HTTP basic auth. Define os secrets E2E_HTTP_USER e E2E_HTTP_PASS (Settings > Secrets and variables > Actions) ou remove a proteção do alvo no Traefik (ver docs/E2E_STAGE_BASIC_AUTH.md)."
          exit 1
        shell: bash

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @patacerta/shared build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @patacerta/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @patacerta/web exec playwright install-deps chromium

      - name: Sanity check — alvo responde
        run: |
          set -euo pipefail

          host="$(printf '%s' "$E2E_BASE_URL" | sed -E 's#^[a-z]+://([^/]+).*#\1#')"
          auth=()
          if [ -n "${E2E_HTTP_USER:-}" ] && [ -n "${E2E_HTTP_PASS:-}" ]; then
            auth=(--user "$E2E_HTTP_USER:$E2E_HTTP_PASS")
          fi
          if [ "${#auth[@]}" -gt 0 ]; then creds='presentes'; else creds='ausentes'; fi
          echo "Smoke check em $E2E_BASE_URL (alvo=$host, basic auth: $creds)"

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          code=''
          for i in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' "${auth[@]}" "$E2E_BASE_URL" 2>/dev/null || true)"
            if printf '%s' "$code" | grep -qE '^(200|301|302)$'; then
              echo "Alvo respondeu OK (HTTP $code)"
              exit 0
            fi
            if [ "$code" = '401' ] || [ "$code" = '403' ]; then
              if grep -qi '^www-authenticate: *basic' "$headers"; then
                if [ "$creds" = 'presentes' ]; then
                  msg="$E2E_BASE_URL exige HTTP basic auth (Basic realm) e as credenciais E2E_HTTP_USER/E2E_HTTP_PASS foram REJEITADAS - confirma que sao as do middleware Traefik do stage."
                else
                  msg="$E2E_BASE_URL exige HTTP basic auth (Basic realm) e E2E_HTTP_USER/E2E_HTTP_PASS nao estao definidas - a suite Playwright nunca chegaria a correr. Define os dois secrets no repo (Settings > Secrets and variables > Actions) ou desprotege o alvo."
                fi
                echo "::error title=HTTP $code basic auth no alvo::$msg"
              else
                echo "::error title=HTTP $code no alvo::$E2E_BASE_URL devolveu HTTP $code sem WWW-Authenticate: Basic - o alvo nao esta saudavel ou esta protegido por outro mecanismo (WAF/Cloudflare)."
              fi
              exit 1
            fi
            echo "Tentativa $i devolveu HTTP ${code:-sem-resposta}, a aguardar 5s..."
            sleep 5
          done

          echo "::error title=Alvo sem resposta::$E2E_BASE_URL nao respondeu 200/301/302 em 50s (ultimo HTTP ${code:-sem-resposta})."
          exit 1
        shell: bash

      - name: Sanity check — API health
        run: |
          auth=()
          if [ -n "${E2E_HTTP_USER:-}" ] && [ -n "${E2E_HTTP_PASS:-}" ]; then
            auth=(--user "$E2E_HTTP_USER:$E2E_HTTP_PASS")
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$E2E_API_URL/health" 2>/dev/null || true)"
          if [ "$code" = '200' ]; then
            echo "API health OK (HTTP 200)"
          elif [ "$code" = '401' ] || [ "$code" = '403' ]; then
            echo "::error title=API health protegida (HTTP $code)::$E2E_API_URL/health exige credenciais - todos os specs que batem na API vao falhar. Verifica E2E_HTTP_USER/E2E_HTTP_PASS."
            exit 1
          else
            echo "WARN: $E2E_API_URL/health devolveu HTTP ${code:-sem-resposta} (a continuar - endpoint pode ser privado neste ambiente)"
          fi
        shell: bash

      # Só em push: num `workflow_dispatch` o operador lança o run depois de
      # confirmar que o deploy já está em cima (para de propósito, se quiser).
      - name: Aguardar deploy (Last-Modified do alvo)
        if: github.event_name == 'push'
        env:
          DEPLOY_TIMEOUT_SECONDS: ${{ vars.E2E_DEPLOY_TIMEOUT_SECONDS || '600' }}
          DEPLOY_FALLBACK_WAIT_SECONDS: ${{ vars.E2E_DEPLOY_WAIT_SECONDS || '300' }}
          DEPLOY_POLL_SECONDS: ${{ vars.E2E_DEPLOY_POLL_SECONDS || '15' }}
        run: |
          set -euo pipefail

          anchor="${RUN_ANCHOR_EPOCH:-}"
          if ! printf '%s' "$anchor" | grep -qE '^[0-9]+$'; then
            echo "::warning title=Âncora temporal ausente::RUN_ANCHOR_EPOCH não está definida — não é possível detectar o deploy; a suite corre imediatamente."
            exit 0
          fi

          url="${E2E_BASE_URL%/}/"
          timeout="$DEPLOY_TIMEOUT_SECONDS"
          fallback="$DEPLOY_FALLBACK_WAIT_SECONDS"
          poll="$DEPLOY_POLL_SECONDS"
          deadline=$((anchor + timeout))

          req_auth=()
          if [ -n "${E2E_HTTP_USER:-}" ] && [ -n "${E2E_HTTP_PASS:-}" ]; then
            req_auth=(--user "$E2E_HTTP_USER:$E2E_HTTP_PASS")
          fi

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          LAST_HTTP_CODE=''
          LM_EPOCH=''
          # Sonda `/` e preenche LM_EPOCH (epoch do Last-Modified, vazio se
          # indisponível/ilegível) + LAST_HTTP_CODE. Sem subshell: os globais
          # têm de sobreviver à chamada.
          probe() {
            local lm
            LAST_HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -D "$headers" "${req_auth[@]}" "$url" 2>/dev/null || true)"
            # `|| true` no fim: com `pipefail`, um `grep` sem match (header
            # ausente) faria o assignment falhar e o `set -e` matava o step em
            # silêncio (bug apanhado no harness local, ver PATA-CI-3).
            lm="$(grep -i '^last-modified:' "$headers" 2>/dev/null | head -n1 | sed -E 's/^[^:]*:[[:space:]]*//' | tr -d '\r' || true)"
            LM_EPOCH=''
            if [ -n "$lm" ]; then
              LM_EPOCH="$(date -u -d "$lm" +%s 2>/dev/null || true)"
            fi
          }

          iso() { date -u -d "@$1" +%FT%TZ; }

          echo "À espera do deploy de $url (âncora=$(iso "$anchor"), timeout=${timeout}s, fallback=${fallback}s)"
          missing=0
          for _ in $(seq 1 1000); do
            probe
            if [ -n "$LM_EPOCH" ] && [ "$LM_EPOCH" -ge "$anchor" ]; then
              echo "Deploy detectado: Last-Modified=$(iso "$LM_EPOCH") >= âncora $(iso "$anchor") — a suite corre contra o build novo."
              exit 0
            fi
            now="$(date +%s)"
            if [ -z "$LM_EPOCH" ]; then
              missing=$((missing + 1))
              # 1ª falha de leitura pode ser o Traefik a meio do rolling deploy;
              # à 2ª — ou com HTTP != 200, ou com o deadline já gasto (re-run de
              # um push antigo) — assumimos que o header não serve como sinal e
              # caímos numa espera fixa limitada: nunca falhar por não conseguir
              # medir o deploy.
              if [ "$missing" -ge 2 ] || [ "$LAST_HTTP_CODE" != '200' ] || [ "$now" -ge "$deadline" ]; then
                target=$((anchor + fallback))
                if [ "$target" -gt "$deadline" ]; then target="$deadline"; fi
                echo "::warning title=Deploy não detectável::$url não devolve Last-Modified utilizável (HTTP ${LAST_HTTP_CODE:-sem-resposta}) — a aguardar ${fallback}s fixos antes de correr a suite."
                while :; do
                  now="$(date +%s)"
                  [ "$now" -lt "$target" ] || break
                  echo "espera fixa: $((target - now))s restantes"
                  sleep "$poll"
                done
                exit 0
              fi
            else
              if [ "$now" -ge "$deadline" ]; then
                echo "::error title=Deploy não detectado::$url não passou a servir um build >= $(iso "$anchor") em ${timeout}s (último Last-Modified=$(iso "$LM_EPOCH"), HTTP ${LAST_HTTP_CODE:-sem-resposta}). A suite correria contra o build antigo — falha de propósito em vez de dar verde falso."
                exit 1
              fi
              echo "Ainda a servir o build de $(iso "$LM_EPOCH") (deploy não chegou): $((deadline - now))s até ao timeout"
            fi
            sleep "$poll"
          done

          echo "::error title=Espera infinita::limite de iterações do loop de espera atingido."
          exit 1
        shell: bash

      - name: Run Playwright tests
        working-directory: apps/web
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            pnpm test:e2e --grep "${{ github.event.inputs.grep }}"
          else
            pnpm test:e2e
          fi
        shell: bash

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stage
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright traces & artefactos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-stage
          path: apps/web/e2e/.artifacts
          retention-days: 14
